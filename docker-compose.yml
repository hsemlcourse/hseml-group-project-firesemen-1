services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/sample:/app/data/sample:ro
    command: uvicorn eth_price.api:app --host 0.0.0.0 --port 8000

  streamlit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./data/sample:/app/data/sample:ro
    command: streamlit run src/eth_price/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
